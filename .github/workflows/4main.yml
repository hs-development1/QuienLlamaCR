name: Bootstrap QuienLlamaCR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand QuienLlamaCR v0.2
        shell: bash
        run: |
          cat > /tmp/quienllamacr.b64 <<'PAYLOAD'

          PEGA_AQUI_EL_MISMO_BLOQUE_BASE64_QUE_YA_TENES

          PAYLOAD

          base64 --decode /tmp/quienllamacr.b64 > /tmp/QuienLlamaCR-v0.2.zip
          unzip -o /tmp/QuienLlamaCR-v0.2.zip -d .

          # El token de Actions no puede crear otros workflows
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/build-ios.yml

      - name: Commit project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi

          git commit -m "Bootstrap QuienLlamaCR v0.2"
          git push
