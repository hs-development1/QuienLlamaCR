name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: QuienLlamaCR-v0.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify project
        run: |
          xcodebuild \
            -project QuienLlamaCR.xcodeproj \
            -scheme QuienLlamaCR \
            -showBuildSettings

      - name: Build unsigned iOS app
        run: |
          set -o pipefail

          xcodebuild \
            -project QuienLlamaCR.xcodeproj \
            -scheme QuienLlamaCR \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package IPA
        run: |
          APP_PATH="$(find "$PWD/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -name 'QuienLlamaCR.app' \
            -print \
            -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No se encontró QuienLlamaCR.app"
            exit 1
          fi

          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/

          cd package
          zip -qry ../QuienLlamaCR-unsigned.ipa Payload
          cd ..

          ls -lh QuienLlamaCR-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuienLlamaCR-unsigned-ipa
          path: QuienLlamaCR-v0.2/QuienLlamaCR-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: QuienLlamaCR-v0.2/xcodebuild.log
          if-no-files-found: ignore
