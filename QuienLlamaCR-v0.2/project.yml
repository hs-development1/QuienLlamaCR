name: QuienLlamaCR
options:
  bundleIdPrefix: cr.quienllama
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "0.2.0"
targets:
  QuienLlamaCR:
    type: application
    platform: iOS
    sources:
      - path: QuienLlamaCR
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cr.quienllama.app
        INFOPLIST_FILE: Configuration/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/App.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: CallDirectoryExtension
        embed: true
  CallDirectoryExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CallDirectoryExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cr.quienllama.app.CallDirectoryExtension
        INFOPLIST_FILE: Configuration/CallDirectory-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/CallDirectory.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  QuienLlamaCR:
    build:
      targets:
        QuienLlamaCR: all
        CallDirectoryExtension: all
    run:
      config: Debug
    archive:
      config: Release
