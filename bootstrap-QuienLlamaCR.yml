name: Bootstrap QuienLlamaCR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand QuienLlamaCR v0.2
        shell: bash
        run: |
          cat > /tmp/quienllamacr.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/quienllamacr.b64 > /tmp/quienllamacr.tgz
          tar -xzf /tmp/quienllamacr.tgz -C "$GITHUB_WORKSPACE"

      - name: Commit project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bootstrap QuienLlamaCR v0.2"
          git push
